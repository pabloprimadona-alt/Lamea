<!DOCTYPE html>

<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;font-family:sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#touch{position:fixed;inset:0;pointer-events:none;display:none}
#joy{position:absolute;left:max(4vmin,env(safe-area-inset-left));bottom:max(5vmin,env(safe-area-inset-bottom));width:28vmin;height:28vmin;max-width:180px;max-height:180px;border-radius:50%;border:2px solid rgba(160,200,255,.35);background:rgba(120,160,220,.08);pointer-events:auto;touch-action:none}
#knob{position:absolute;left:29%;top:29%;width:42%;height:42%;border-radius:50%;background:rgba(170,210,255,.28);border:2px solid rgba(190,220,255,.5)}
.btn{position:absolute;border-radius:50%;pointer-events:auto;touch-action:none;display:flex;align-items:center;justify-content:center;color:#fff;font:700 13px sans-serif;letter-spacing:1px;border:2px solid rgba(255,255,255,.4);background:rgba(255,255,255,.1)}
.btn:active{background:rgba(255,255,255,.3)}
#bJump{right:max(4vmin,env(safe-area-inset-right));bottom:max(5vmin,env(safe-area-inset-bottom));width:20vmin;height:20vmin;max-width:120px;max-height:120px}
#bAct{right:calc(max(4vmin,env(safe-area-inset-right)) + min(22vmin,130px));bottom:max(8vmin,env(safe-area-inset-bottom));width:15vmin;height:15vmin;max-width:90px;max-height:90px}
#bRun{right:max(6vmin,env(safe-area-inset-right));bottom:calc(max(5vmin,env(safe-area-inset-bottom)) + min(23vmin,130px));width:11vmin;height:11vmin;max-width:66px;max-height:66px;font-size:11px}
#bAtk{right:calc(max(4vmin,env(safe-area-inset-right)) + min(40vmin,240px));bottom:max(6vmin,env(safe-area-inset-bottom));width:15vmin;height:15vmin;max-width:90px;max-height:90px;border-color:rgba(255,60,80,.7);background:rgba(255,40,60,.15)}
#mute{position:fixed;top:max(8px,env(safe-area-inset-top));right:max(8px,env(safe-area-inset-right));width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.25);color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;z-index:5;touch-action:none;opacity:.3}
#skip{position:fixed;bottom:max(10px,env(safe-area-inset-bottom));right:max(10px,env(safe-area-inset-right));display:none;padding:8px 14px;border-radius:18px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.3);color:#dfe8ff;font:600 12px sans-serif;letter-spacing:1px;cursor:pointer;z-index:6;touch-action:none}
#pauseBtn{position:fixed;top:calc(max(8px,env(safe-area-inset-top)) + 42px);right:max(8px,env(safe-area-inset-right));width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.25);color:#fff;display:none;align-items:center;justify-content:center;font:700 12px sans-serif;cursor:pointer;z-index:5;touch-action:none;opacity:.3}
</style></head><body>
<canvas id="c"></canvas>
<div id="mute">🔊</div><div id="pauseBtn">II</div><div id="skip">SKIP ▶▶</div><div id="touch"><div id="joy"><div id="knob"></div></div><div class="btn" id="bJump">JUMP</div><div class="btn" id="bAct">ACT</div><div class="btn" id="bRun">RUN</div><div class="btn" id="bAtk">ATK</div></div>
<script>
'use strict';
const W=1280,H=720,T=32;
let globalVolume=1,inGameBrightness=1;   // pause-menu settings (real time)
function setGlobalVolume(v){globalVolume=clamp(Math.round(v*10)/10,0,1);if(window.game&&window.game.audio)window.game.audio.setVolume();}
function setBrightness(v){inGameBrightness=clamp(Math.round(v*10)/10,.4,1.6);}
const MENU_BGM_ID='Star Colde';   // main-menu track identifier
const GAME_WIDTH=1280;   // canvas logical width
const HUMAN_SPEED=5.5,HUMAN_WALK=HUMAN_SPEED*60,CLIMB_SPEED=1.8*60;   // climbSpeed = 1.8 px/frame: heavy, tactical climbing   // 5.5 px/frame @60fps = 330 px/s
const POEMS=["Five years of warmth under a borrowed sun... yet shadows lengthen, hiding the chains of tomorrow.",
 "I carry the relic of our quiet days, knowing every melody we shared was built upon a beautiful, sacred lie.",
 "A king's cage glitters in the distance, promising luxury bought with the blood of the monster who loved you.",
 "Your words speak of medicine and old parents, but my wolf ears only hear the silent weeping of your trapped family.",
 "Let the silver pierce my willing heart, Mealin. If my demise is the price of your freedom, I will die smiling in the dark."];
const POEMS_MORE=["The wind keeps counting the footsteps we left, and every one of them leads back to a door I cannot open.",
 "Even the tide forgets its shore, but my hands remember the warmth of yours.",
 "I learned the shape of loyalty from a silence that never once asked for my name.",
 "Somewhere beyond the gate a lullaby waits for the one who stopped believing in mornings.",
 "The moon lends me its silver, and I repay it in quiet promises I will never be allowed to keep."];
function poemFor(n){return n<=5?POEMS[n-1]:POEMS_MORE[(n-6)%POEMS_MORE.length];}
const SECRET_NAME='LANGNO VAN ORLANDO';   // hidden imperial name: never rendered in-game, revealed only by the ending
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t,damp=(a,b,k,dt)=>lerp(a,b,1-Math.exp(-k*dt)),rnd=(a,b)=>a+Math.random()*(b-a);
const hit=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
const $=id=>document.getElementById(id);
function taper(c,x1,y1,x2,y2,w1,w2){   // tapered limb as a closed bezier path (half-widths w1 -> w2)
 const dx=x2-x1,dy=y2-y1,l=Math.hypot(dx,dy)||1,nx=-dy/l,ny=dx/l,mx=(x1+x2)/2,my=(y1+y2)/2,wm=(w1+w2)/2*1.15;
 c.beginPath();c.moveTo(x1+nx*w1,y1+ny*w1);c.bezierCurveTo(mx+nx*wm,my+ny*wm,mx+nx*wm,my+ny*wm,x2+nx*w2,y2+ny*w2);c.lineTo(x2-nx*w2,y2-ny*w2);c.bezierCurveTo(mx-nx*wm,my-ny*wm,mx-nx*wm,my-ny*wm,x1-nx*w1,y1-ny*w1);c.closePath();}
function limb(c,x1,y1,x2,y2,w,col){c.strokeStyle=col;c.lineWidth=w;c.lineCap='round';c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke();}

/* ================= INPUT ================= */
class Input{
 constructor(){
  this.keys={};this.edge={};this.joy={x:0,y:0};this.btn={jump:false,act:false,run:false};
  this.touch=('ontouchstart' in window)||navigator.maxTouchPoints>0;this.keyboard=false;
  const map={KeyA:'left',ArrowLeft:'left',KeyD:'right',ArrowRight:'right',KeyW:'up',ArrowUp:'up',Space:'up',KeyS:'down',ArrowDown:'down',ShiftLeft:'run',ShiftRight:'run',KeyE:'act',KeyJ:'dmg',KeyR:'revive',KeyT:'reset',KeyN:'next',KeyK:'attack',KeyY:'unrage',KeyM:'mute',Backquote:'debug',F3:'debug'};
  addEventListener('keydown',e=>{const a=map[e.code];if(!a)return;e.preventDefault();this.keyboard=true;if(!this.keys[a])this.edge[a]=true;this.keys[a]=true;});
  addEventListener('keyup',e=>{const a=map[e.code];if(a)this.keys[a]=false;});
  addEventListener('blur',()=>{this.keys={};this.joy.x=this.joy.y=0;});
  if(this.touch)$('touch').style.display='block';
  addEventListener('pointerdown',e=>{if(e.pointerType==='touch'){this.touch=true;$('touch').style.display='block';}});
  const joy=$('joy'),knob=$('knob');let pid=null;
  const upd=e=>{const r=joy.getBoundingClientRect(),R=r.width/2;let dx=(e.clientX-r.left-R)/R,dy=(e.clientY-r.top-R)/R;const l=Math.hypot(dx,dy);if(l>1){dx/=l;dy/=l;}
   this.joy.x=Math.abs(dx)<.2?0:dx;this.joy.y=dy;knob.style.transform=`translate(${dx*R*.55}px,${dy*R*.55}px)`;};
  const rel=()=>{pid=null;this.joy.x=this.joy.y=0;knob.style.transform='';};
  joy.addEventListener('pointerdown',e=>{pid=e.pointerId;joy.setPointerCapture(pid);upd(e);e.preventDefault();});
  joy.addEventListener('pointermove',e=>{if(e.pointerId===pid)upd(e);});
  joy.addEventListener('pointerup',rel);joy.addEventListener('pointercancel',rel);
  [['bJump','jump'],['bAct','act'],['bRun','run'],['bAtk','atk']].forEach(([id,n])=>{const b=$(id);
   b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);this.btn[n]=true;if(n==='act')this.edge.act=true;if(n==='atk')this.edge.attack=true;});
   const up=()=>{this.btn[n]=false;};b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);});
  document.addEventListener('contextmenu',e=>e.preventDefault());
 }
 pressed(a){const v=this.edge[a];this.edge[a]=false;return !!v;}
 get axisX(){return clamp((this.keys.right?1:0)-(this.keys.left?1:0)+this.joy.x,-1,1);}
 get jump(){return !!(this.keys.up||this.btn.jump||this.joy.y<-.75);}
 get run(){return !!(this.keys.run||this.btn.run);}
 get down(){return !!(this.keys.down||this.joy.y>.75);}
}

/* ================= WORLD ================= */
class World{
 constructor(tw,th){this.w=tw*T;this.h=th;this.solids=[];this.blocks=[];this.hazards=[];this.monsters=[];this.exit=null;this.lamps=[];this.fg=[];this.interactables=[];this.checkpoints=[];this.spawn={x:96,y:500};this.stars=[];
  for(let i=0;i<110;i++)this.stars.push({x:Math.random()*W,y:Math.random()*H*.6,r:rnd(.4,1.5),p:rnd(0,6)});}
 add(tx,ty,tw,th,kind='block'){this.solids.push({x:tx*T,y:ty*T,w:tw*T,h:th*T,kind});}
 solidAt(px,py){return this.solids.some(s=>px>=s.x&&px<s.x+s.w&&py>=s.y&&py<s.y+s.h)||this.blocks.some(s=>px>=s.x&&px<s.x+s.w&&py>=s.y&&py<s.y+s.h);}
}

/* ================= PHYSICS ================= */
class Physics{
 constructor(world){this.world=world;this.gravity=1900;this.maxFall=1400;this.step=10;}
 all(b){return this.world.solids.concat(this.world.blocks.filter(o=>o!==b));}
 move(b,dt){
  const S=this.all(b),was=b.onGround;b.hitWall=false;
  b.x+=b.vx*dt;
  for(const s of S){if(!hit(b,s))continue;
   const over=b.y+b.h-s.y;
   if(was&&over>0&&over<=this.step){const t={x:b.x,y:s.y-b.h,w:b.w,h:b.h};if(!S.some(o=>hit(t,o))){b.y=t.y;continue;}} // slope-safe step-up
   if(b.vx>0)b.x=s.x-b.w;else if(b.vx<0)b.x=s.x+s.w;
   b.vx=0;b.hitWall=true;}
  if(!b.noGrav)b.vy=Math.min(b.vy+this.gravity*dt,this.maxFall);
  const pvy=b.vy;b.y+=b.vy*dt;b.onGround=false;
  for(const s of S){if(!hit(b,s))continue;
   if(b.vy>0){b.y=s.y-b.h;b.onGround=true;}else if(b.vy<0)b.y=s.y+s.h;
   b.vy=0;}
  b.landed=(b.onGround&&!was)?pvy:0;
 }
}

/* ================= CAMERA ================= */
class Camera{
 constructor(){this.x=0;this.y=0;this.zoom=1;this.targetZoom=1;this.zoomSpeed=4;this.sx=0;this.sy=0;this.shakeT=0;this.shakeD=1;this.shakeM=0;this.dead={w:180,h:100};this.bounds={w:W,h:H};this.look=0;this.focus=null;}
 get vw(){return W/this.zoom;} get vh(){return H/this.zoom;}
 setBounds(w,h){this.bounds={w,h};}
 setZoom(z,instant){this.targetZoom=Math.min(z,2.5);if(instant)this.zoom=this.targetZoom;}   // Day 3 API
 shake(m,d=.25){this.shakeM=m;this.shakeD=d;this.shakeT=d;}      // Day 3/4 API
 snap(t){this.x=t.x+t.w/2-this.vw/2;this.y=t.y+t.h/2-this.vh/2;this.clampPos();}
 clampPos(){this.x=clamp(this.x,0,Math.max(0,this.bounds.w-this.vw));this.y=clamp(this.y,0,Math.max(0,this.bounds.h-this.vh));}
 follow(t,dt){
  this.zoom=damp(this.zoom,this.targetZoom,this.zoomSpeed,dt);
  if(this.focus){const f=typeof this.focus==='function'?this.focus():this.focus;this.x=damp(this.x,f.x-this.vw/2,6,dt);this.y=damp(this.y,f.y-this.vh/2,6,dt);this.clampPos();
   if(this.shakeT>0){this.shakeT-=dt;const k=Math.max(0,this.shakeT/this.shakeD)*this.shakeM;this.sx=rnd(-1,1)*k;this.sy=rnd(-1,1)*k;}else this.sx=this.sy=0;return;}
  this.look=damp(this.look,(t.facing||1)*60*Math.min(1,Math.abs(t.vx)/250),2,dt);
  const tx=t.x+t.w/2+this.look,ty=t.y+t.h/2-30,cx=this.x+this.vw/2,cy=this.y+this.vh/2;
  let nx=this.x,ny=this.y;const dx=tx-cx,dy=ty-cy;
  if(Math.abs(dx)>this.dead.w/2)nx+=dx-Math.sign(dx)*this.dead.w/2;
  if(Math.abs(dy)>this.dead.h/2)ny+=dy-Math.sign(dy)*this.dead.h/2;
  this.x=damp(this.x,nx,7,dt);this.y=damp(this.y,ny,5,dt);this.clampPos();
  if(this.shakeT>0){this.shakeT-=dt;const k=Math.max(0,this.shakeT/this.shakeD)*this.shakeM;this.sx=rnd(-1,1)*k;this.sy=rnd(-1,1)*k;}else this.sx=this.sy=0;
 }
 apply(c){c.translate(W/2,H/2);c.scale(this.zoom,this.zoom);c.translate(-(this.x+this.vw/2)+this.sx,-(this.y+this.vh/2)+this.sy);}
}

/* ================= PARTICLES ================= */
class Particles{   // pooled: fixed preallocated array, ring-buffer reuse, zero per-particle allocation
 constructor(){const N=this.N=(typeof matchMedia==='function'&&matchMedia('(pointer:coarse)').matches)?450:800;this.pool=[];
  for(let i=0;i<N;i++)this.pool.push({a:false,x:0,y:0,vx:0,vy:0,g:0,life:0,max:1,size:1,color:'#fff',glow:false,fric:0,sway:0,ph:0,shape:'c',rot:0,vr:0,grow:0});
  this.cur=0;this.bolts=[];}
 clear(){for(const p of this.pool)p.a=false;this.bolts.length=0;}
 get count(){let n=0;for(const p of this.pool)if(p.a)n++;return n;}
 _e(x,y,vx,vy,g,life,size,color,glow,shape,vr,grow,fric,sway){const p=this.pool[this.cur];this.cur=(this.cur+1)%this.N;
  p.a=true;p.x=x;p.y=y;p.vx=vx;p.vy=vy;p.g=g;p.life=p.max=life;p.size=size;p.color=color;p.glow=glow;p.shape=shape;p.vr=vr;p.grow=grow;p.fric=fric;p.sway=sway;p.ph=Math.random()*6;p.rot=Math.random()*6.28;}
 emit(x,y,o={}){this._e(x,y,o.vx||0,o.vy||0,o.g||0,o.life||1,o.size||2,o.color||'#fff',!!o.glow,o.shape||'c',o.vr||0,o.grow||0,o.fric||0,o.sway||0);}
 burst(x,y,n,o={}){const sp=o.spread||60,up=o.up||60,lf=o.lf||1;for(let i=0;i<n;i++)this._e(x,y,rnd(-1,1)*sp,rnd(-1,0)*up,o.g||0,rnd(.3,.7)*lf,rnd(1,3),o.color||'#fff',!!o.glow,'c',0,0,o.fric||0,o.sway||0);}
 leaf(x,y){const cols=['#5fc04a','#3f9e3a','#86d65a','#2f8a42'];this._e(x,y,rnd(-20,30),rnd(25,55),0,rnd(6,9),rnd(2.2,3.6),cols[(Math.random()*4)|0],false,'f',rnd(-3,3),0,0,rnd(18,34));}
 sparks(x,y,n=12,col='#ffe9a8'){for(let i=0;i<n;i++){const a=rnd(0,6.283),s=rnd(120,460);this._e(x,y,Math.cos(a)*s,Math.sin(a)*s-60,700,rnd(.25,.7),rnd(1,2.4),col,true,'l',0,0,0,0);}}
 smoke(x,y,n=8,col='#2a2a30'){for(let i=0;i<n;i++)this._e(x+rnd(-14,14),y+rnd(-6,6),rnd(-40,40),-rnd(20,70),0,rnd(.9,1.6),rnd(5,10),col,false,'m',0,rnd(18,36),.98,0);}
 shards(x,y,n=20,col='#4a1d12'){for(let i=0;i<n;i++){const a=rnd(-3.0,-.15),s=rnd(180,560);this._e(x,y,Math.cos(a)*s,Math.sin(a)*s,1100,rnd(.8,1.6),rnd(2,5),col,false,'s',rnd(-14,14),0,0,0);}}
 electric(x,y,r=240,n=10){for(let i=0;i<n;i++){const a=i*6.283/n+rnd(-.2,.2),pts=[{x,y}],seg=9;for(let k=1;k<=seg;k++){const d=r*k/seg*rnd(.8,1.1);pts.push({x:x+Math.cos(a)*d+rnd(-16,16),y:y+Math.sin(a)*d+rnd(-16,16)});}if(this.bolts.length<40)this.bolts.push({pts,life:.35,max:.35});}this.sparks(x,y,16,'#ffffff');}
 slash(x,y,dir,kind){const col=werewolfClawColor;
  const line=(x1,y1,x2,y2)=>{for(let i=0;i<=16;i++){const u=i/16;this._e(lerp(x1,x2,u),lerp(y1,y2,u),(x2-x1)*1.6,(y2-y1)*1.6,0,.2+.12*u,3.4-u*1.8,col,true,'l',0,0,.9,0);}};
  if(kind===1){for(let j=0;j<2;j++)line(x-dir*10,y-26+j*14,x+dir*150,y-6+j*14);}
  else if(kind===2){for(let j=0;j<3;j++)line(x+dir*(30+j*16),y-95,x+dir*(30+j*16),y+55);}
  else{line(x-130,y-90,x+130,y+60);line(x+130,y-90,x-130,y+60);line(x-110,y-100,x+150,y+50);line(x+150,y-100,x-110,y+50);}
  this.sparks(x+dir*60,y,kind===3?24:10,col);}
 impact(x,y,n=24){this._e(x,y,0,0,0,.5,6,'#ffffff',true,'r',0,260,0,0);this._e(x,y,0,0,0,.4,4,'#ff2038',true,'r',0,170,0,0);this.sparks(x,y,n,'#ffffff');this.dust(x,y,10,'#8a92a3');}
 dust(x,y,n=6,col='#59667a'){for(let i=0;i<n;i++)this._e(x+rnd(-8,8),y,rnd(-90,90),-rnd(10,60),80,rnd(.3,.7),rnd(2,4),col,false,'m',0,0,0,0);}
 aura(x,y,w,h){const r=Math.random()<.4;this._e(x+rnd(0,w),y+rnd(0,h),rnd(-12,12),-rnd(30,90),0,rnd(.5,1),r?rnd(1.5,3):rnd(4,8),r?'#c81e1e':'#08080b',false,r?'c':'m',0,r?0:14,0,0);}
 update(dt){
  for(let i=this.bolts.length-1;i>=0;i--)if((this.bolts[i].life-=dt)<=0)this.bolts.splice(i,1);
  for(const p of this.pool){if(!p.a)continue;p.life-=dt;if(p.life<=0){p.a=false;continue;}
   p.vy+=p.g*dt;if(p.fric)p.vx*=Math.pow(p.fric,dt*60);p.rot+=p.vr*dt;p.x+=p.vx*dt+Math.sin(p.ph+p.life*3)*p.sway*dt;p.y+=p.vy*dt;}}
 draw(c){
  for(const b of this.bolts){const a=b.life/b.max;c.save();c.globalCompositeOperation='lighter';c.strokeStyle='rgba(255,255,255,'+a+')';c.lineWidth=1+3*a;c.shadowColor='#bfe2ff';c.shadowBlur=14;c.beginPath();c.moveTo(b.pts[0].x,b.pts[0].y);for(let i=1;i<b.pts.length;i++)c.lineTo(b.pts[i].x,b.pts[i].y);c.stroke();c.restore();}
  for(const p of this.pool){if(!p.a)continue;const a=clamp(p.life/p.max,0,1);c.globalCompositeOperation=p.glow?'lighter':'source-over';
   if(p.shape==='r'){c.globalAlpha=a;c.strokeStyle=p.color;c.lineWidth=1+4*a;c.beginPath();c.arc(p.x,p.y,p.size+p.grow*(1-a),0,6.283);c.stroke();continue;}
   if(p.shape==='f'){c.globalAlpha=Math.min(1,a*2);c.fillStyle=p.color;c.save();c.translate(p.x,p.y);c.rotate(p.rot);c.beginPath();c.ellipse(0,0,p.size*1.8,p.size*.8,0,0,6.283);c.fill();c.strokeStyle='rgba(20,70,25,.55)';c.lineWidth=.6;c.beginPath();c.moveTo(-p.size*1.8,0);c.lineTo(p.size*1.8,0);c.stroke();c.restore();continue;}

class Block{

  if(this.grabbed)this.vx=0;
  else{this.vx*=Math.pow(.8,dt*60);if(Math.abs(this.vx)<2)this.vx=0;
   if(this.onGround&&this.vx===0){const sx=Math.round(this.x/T)*T,d=sx-this.x;if(Math.abs(d)<.6)this.x=sx;else this.vx=clamp(d*10,-60,60);}}
  g.physics.move(this,dt);}

  const gr=c.createLinearGradient(0,0,0,h);gr.addColorStop(0,'#4a5160');gr.addColorStop(1,'#1f232c');c.fillStyle=gr;c.fillRect(0,0,w,h);

class Monster{
 constructor(x,y,w,h){this.x=x;this.y=y;this.w=w;this.h=h;this.vx=0;this.vy=0;this.onGround=false;this.hitWall=false;this.facing=-1;this.state='IDLE';this.t=0;this.stateT=0;this.hp=3;this.alive=true;this.noGrav=false;this.hurtT=0;this.freezeT=0;this.stun=0;this.rage=false;}
 get cx(){return this.x+this.w/2;}
 setState(s){this.state=s;this.stateT=0;}
 update(dt,g){
  this.t+=dt;this.stateT+=dt;this.hurtT-=dt;
  if(this.rage&&Math.random()<dt*10)g.particles.emit(this.cx+rnd(-14,14),this.y+rnd(0,this.h),{vy:-26,life:.9,size:1.3,color:'#c81e1e',sway:16});
  if(this.freezeT>0){this.freezeT-=dt;return;}
  if(this.stun>0){this.stun-=dt;this.vx*=Math.pow(.88,dt*60);if(this.noGrav){this.x+=this.vx*dt;this.y+=this.vy*dt;this.vy*=.9;}else g.physics.move(this,dt);return;}
  this.think(dt,g);}
 think(dt,g){} draw(c){}
 hurt(d,g,sx,pull){if(!this.alive)return;this.hp-=d;this.hurtT=.12;this.stun=.3;g.particles.sparks(this.cx,this.y+this.h/2,14,'#ff3040');
  this.vx=pull?clamp((sx-this.cx)*5,-560,560):(this.cx<sx?-1:1)*280;this.vy=this.noGrav?-30:-170;this.freezeT=0;
  if(this.hp<=0){this.alive=false;const x=this.cx,y=this.y+this.h/2;g.particles.impact(x,y,22);g.particles.smoke(x,y,10,'#1a1a1e');g.particles.shards(x,y,12,'#5a606e');g.camera.shake(6,.25);g.emit('monsterDie',this);if(this.wave)g.onWaveKill(this);}}
 enrage(){this.rage=true;this.hp=2;this.freezeT=.5;}
}
class IronCracker extends Monster{

 think(dt,g){
  const P=g.player,dx=P.cx-this.cx,dy=(P.y+P.h)-(this.y+this.h),d=Math.abs(dx),see=d<520+this.lv*220&&Math.abs(dy)<100&&P.armor>0;this.cool-=dt;this.touch-=dt;if(this.touch<=0&&P.armor>0&&hit(this,P)){P.hurt(g,this.cx);this.touch=1.6;}
  if(this.state==='ATTACK'){
   this.vx*=Math.pow(.8,dt*60);
   if(this.stateT>.5&&!this.hitDone){this.hitDone=true;const hb={x:this.facing>0?this.cx:this.cx-56,y:this.y+8,w:56,h:56};g.camera.shake(3,.12);g.audio.sfx('thud');g.particles.burst(this.cx+this.facing*40,this.y+this.h,8,{color:'#8a92a3',spread:120,up:80,g:500});if(hit(hb,P))P.hurt(g,this.cx);}
   if(this.stateT>.95)this.setState('CHASE');}
  else if(see){
   this.facing=dx>0?1:-1;
   if(d<56&&this.cool<=0){this.setState('ATTACK');this.hitDone=false;this.cool=Math.max(.9,1.8-this.lv*.9);}
   else{this.state='CHASE';const ok=g.world.solidAt(this.cx+this.facing*30,this.y+this.h+8);this.vx=damp(this.vx,ok&&d>50?this.facing*72*(1+this.lv*.7):0,6,dt);}}

  g.physics.move(this,dt);
 }

  const f=this.facing,ph=this.t*4*Math.min(1,Math.abs(this.vx)/50),atk=this.state==='ATTACK',wu=Math.min(1,this.stateT/.5);

  c.fillStyle='#3a3f4a';c.fillRect(-12,-66,24,16);c.fillStyle='#14161b';c.fillRect(-9,-60,18,5);
  c.shadowColor='#f33';c.shadowBlur=atk?18:10;c.fillStyle='#ff4a3a';c.fillRect(1,-59,8,3);c.shadowBlur=0;
  c.save();c.translate(10,-46);c.rotate(arm);limb(c,0,0,0,26,9,'#3a3f4a');c.fillStyle='#22252c';c.fillRect(-11,22,22,16);c.fillStyle='#5b6272';c.fillRect(-11,22,22,3);c.restore();
  c.restore();}
}
class PhaseGhost extends Monster{
 constructor(x,y,lv=0){super(x,y,34,50);this.noGrav=true;this.state='DRIFT';this.alpha=.04;this.type='ghost';this.lv=lv;}

  const M=g.rage.on?g.player:g.mealin,tx=M.cx-this.cx,ty=M.y+20-this.y,d=Math.hypot(tx,ty),dead=M.state==='DEAD'&&!g.rage.on;

    if(!dead&&d<230)this.setState('MATERIALIZE');

  c.restore();}
}
class RedShade extends Monster{   // crimson silhouette hunter, fast chaser, 2 hits in Rage
 constructor(x,y){super(x,y,30,56);this.type='shade';this.state='CHASE';this.cool=0;this.touch=0;this.hitDone=false;}
 think(dt,g){
  const P=g.player,dx=P.cx-this.cx,d=Math.abs(dx);this.cool-=dt;this.touch-=dt;

   if(this.stateT>.7)this.setState('CHASE');}
  else{this.facing=dx>0?1:-1;
   if(d<46&&this.cool<=0){this.setState('ATTACK');this.hitDone=false;this.cool=1.2;}
   else{this.state='CHASE';const ok=g.world.solidAt(this.cx+this.facing*28,this.y+this.h+8);this.vx=damp(this.vx,ok&&d>36?this.facing*215:0,6,dt);}}
  if(this.touch<=0&&P.armor>0&&hit(this,P)){P.hurt(g,this.cx);this.touch=1.5;}
  if(this.onGround&&this.hitWall)this.vy=-640;
  g.physics.move(this,dt);}
 draw(c){
  const f=this.facing,R=!!this.rage,ph=this.t*7*Math.min(1,Math.abs(this.vx)/150),atk=this.state==='ATTACK',wu=Math.min(1,this.stateT/.35),arm=atk?(this.stateT<.35?wu*1.8:1.8-3.4*Math.min(1,(this.stateT-.35)/.1)):Math.sin(ph)*.5;
  c.save();c.translate(this.cx,this.y+this.h);c.scale(f,1);

  c.fillStyle=R?'#4a070b':'#06060b';taper(c,-4,-26,-4+Math.sin(ph)*8,-2,3.4,2);c.fill();taper(c,4,-26,4-Math.sin(ph)*8,-2,3.4,2);c.fill();
  const g2=c.createLinearGradient(0,-60,0,0);if(R){g2.addColorStop(0,'#c01822');g2.addColorStop(1,'#4a060a');}else{g2.addColorStop(0,'#15151e');g2.addColorStop(1,'#030307');}
  c.fillStyle=g2;if(R){c.shadowColor='#ff2a2a';c.shadowBlur=14;}   // red phase: the silhouette itself glows (no radial discs)
  c.beginPath();c.moveTo(-6,-52);c.bezierCurveTo(-13,-44,-14,-24,-12+Math.sin(this.t*5)*2,-8);c.lineTo(-8,-3);c.lineTo(-4,-9);c.lineTo(0,-2);c.lineTo(4,-9);c.lineTo(9,-3);c.lineTo(12,-10);c.bezierCurveTo(14,-26,12,-44,6,-52);c.bezierCurveTo(2,-57,-2,-57,-6,-52);c.closePath();c.fill();c.shadowBlur=0;
  c.strokeStyle=R?'rgba(255,140,140,.55)':'rgba(170,180,210,.3)';c.lineWidth=.9;c.stroke();
  c.fillStyle=R?'#2a0408':'#020205';c.beginPath();c.moveTo(-5,-56);c.bezierCurveTo(-6,-64,0,-68,5,-64);c.bezierCurveTo(8,-61,7,-55,5,-52);c.bezierCurveTo(1,-54,-3,-54,-5,-56);c.fill();
  c.strokeStyle=R?'#ffd0d0':'#aeb8d0';c.lineWidth=1.2;c.lineCap='round';c.beginPath();c.moveTo(1,-60);c.lineTo(5,-59);c.stroke();
  c.save();c.translate(6,-46);c.rotate(arm);c.fillStyle=R?'#7a0c12':'#0a0a10';taper(c,0,0,0,24,2.8,1.8);c.fill();c.fillStyle=R?'#2a0408':'#030306';c.beginPath();c.moveTo(-1.5,22);c.bezierCurveTo(-2,32,0,40,2,46);c.bezierCurveTo(3,38,3.5,30,2.6,22);c.closePath();c.fill();c.restore();
  c.restore();}
}
class Stalker extends RedShade{   // calm horizontal patrol; alerts and charges only when a target enters its line of sight (no hopping)
 constructor(x,y){super(x,y);this.type='stalker';this.hp=2;this.wave=true;this.cool=.8;this.home=x;this.facing=Math.random()<.5?-1:1;this.turnCd=0;this.state='PATROL';this.lost=0;this.seenX=x;this.tgt=null;}
 los(g,T0){const x0=this.cx,y0=this.y+16,x1=T0.cx,y1=T0.y+T0.h*.4;
  if(Math.abs(x1-x0)>520||Math.abs(T0.y+T0.h-(this.y+this.h))>90)return false;
  if((x1-x0)*this.facing<0&&Math.abs(x1-x0)>90)return false;
  const n=Math.ceil(Math.abs(x1-x0)/16);for(let i=1;i<n;i++){const u=i/n;if(g.world.solidAt(x0+(x1-x0)*u,y0+(y1-y0)*u))return false;}return true;}
 pick(g){const M=g.mealin,P=g.player,cs=[];if(P.armor>0)cs.push(P);if(M.state!=='DEAD'&&M.rise<=0)cs.push(M);let best=null,bd=1e9;
  for(const T0 of cs){if(this.los(g,T0)){const d=Math.abs(T0.cx-this.cx);if(d<bd){bd=d;best=T0;}}}return best;}
 think(dt,g){
  const P=g.player,M=g.mealin,rage=g.rage.on;this.cool-=dt;this.turnCd-=dt;
  const front=g.world.solidAt(this.cx+this.facing*30,this.y+this.h+8),wall=g.world.solidAt(this.cx+this.facing*(this.w/2+6),this.y+this.h-14),T0=this.pick(g);
  if(this.state==='ATTACK'){this.vx*=Math.pow(.8,dt*60);
   if(this.stateT>.35&&!this.hitDone){this.hitDone=true;const hb={x:this.facing>0?this.cx:this.cx-50,y:this.y,w:50,h:this.h};if(this.tgt===P&&hit(hb,P))P.hurt(g,this.cx);else if(this.tgt===M&&hit(hb,M))M.damage(1);}
   if(this.stateT>.7)this.setState('CHASE');}
  else if(this.state==='ALERT'){this.vx=damp(this.vx,0,10,dt);if(T0){this.facing=T0.cx>this.cx?1:-1;this.tgt=T0;}if(this.stateT>.4)this.setState('CHASE');}
  else if(T0){this.tgt=T0;this.lost=0;this.seenX=T0.cx;const dx=T0.cx-this.cx,d=Math.abs(dx);this.facing=dx>0?1:-1;
   if(this.state==='PATROL'){this.setState('ALERT');}
   else if(d<48&&this.cool<=0){this.setState('ATTACK');this.hitDone=false;this.cool=rage?1.1:1.5;}
   else{this.state='CHASE';this.vx=damp(this.vx,(d>38&&front&&!wall)?this.facing*(rage?215:185):0,6,dt);}}
  else if(this.state==='CHASE'){this.lost+=dt;const dx=this.seenX-this.cx;
   if(this.lost>2||Math.abs(dx)<20)this.setState('PATROL');else{this.facing=dx>0?1:-1;this.vx=damp(this.vx,front&&!wall?this.facing*150:0,5,dt);}}
  else{this.state='PATROL';if(this.turnCd<=0&&(!front||wall||(this.cx-this.home)*this.facing>5*T)){this.facing=-this.facing;this.turnCd=.8;}
   this.vx=damp(this.vx,this.turnCd>.4?0:this.facing*55,4,dt);}
  g.physics.move(this,dt);}
 draw(c){super.draw(c);
  if(this.state==='ALERT'){c.save();c.font='bold 18px "Trebuchet MS",sans-serif';c.textAlign='center';c.fillStyle='#ffdede';c.shadowColor='#ff3a3a';c.shadowBlur=8;c.fillText('!',this.cx,this.y-6);c.restore();}

  for(const c of w.checkpoints)if(p.x>c.x&&(!this.checkpoint||c.x>this.checkpoint.x))this.checkpoint=c;
  if(p.y>H+250){const s=this.checkpoint||w.spawn;p.x=s.x;p.y=s.y;p.vx=p.vy=0;this.camera.shake(6,.3);}
  {const th=this.world.theme;if(th.n==='Day'){if(Math.random()<dt*14)this.particles.leaf(this.camera.x+rnd(-80,this.camera.vw+160),this.camera.y-20);}else if(!this.rage.on&&Math.random()<dt*th.rate)this.particles.emit(this.camera.x+rnd(0,this.camera.vw),this.camera.y+rnd(th.pvy[0]<0?200:-10,this.camera.vh),{vx:rnd(-8,8),vy:rnd(th.pvy[0],th.pvy[1]),life:rnd(3,6),size:1.4,color:this.rage.on?'#ff5a5a':th.part,glow:true,sway:25});}
  this.updateProjectiles(dt);this.autoZoom();this.camera.follow(p,dt);this.ui.update(dt);this.stages.update(dt);if(this.gameOverT>0){this.gameOverT-=dt;if(this.gameOverT<=0)this.stages.reset();}}
 get isRageMode(){return this.rage.on;}
 updateProjectiles(dt){const w=this.world;
  for(let i=this.bullets.length-1;i>=0;i--){const b=this.bullets[i],px=b.x,py=b.y;b.x+=b.vx*dt;b.y+=(b.vy||0)*dt;b.life-=dt;let dead=b.life<=0;
   if(!dead&&w.solidAt(b.x,b.y)){this.impactFx(b.x,b.y,'#4c5a70');dead=true;}   // miss: slams into a tile/prop -> the same massive debris + shake
   if(!dead)for(const m of w.monsters){if(!m.alive||(m.type==='ghost'&&m.alpha<.25))continue;if(Math.max(px,b.x)>m.x&&Math.min(px,b.x)<m.x+m.w&&Math.max(py,b.y)>m.y&&Math.min(py,b.y)<m.y+m.h){m.hp=0;m.hurt(0,this,b.x-b.vx*.02,false);this.impactFx(b.x,b.y,'#16161c');dead=true;break;}}
   if(dead)this.bullets.splice(i,1);}
  for(let i=this.hearts.length-1;i>=0;i--){const h=this.hearts[i],tg=h.tg;h.life-=dt;
   if(!tg.alive||h.life<=0){this.hearts.splice(i,1);continue;}
   const dx=tg.cx-h.x,dy=tg.y+tg.h*.4-h.y,l=Math.hypot(dx,dy)||1,k=1-Math.exp(-7*dt);h.vx=lerp(h.vx,dx/l*520,k);h.vy=lerp(h.vy,dy/l*520,k);h.x+=h.vx*dt;h.y+=h.vy*dt;
   if(Math.random()<dt*50)this.particles.emit(h.x,h.y,{vx:rnd(-20,20),vy:rnd(-20,20),life:.4,size:2,color:'#ffffff',glow:true});
   if(Math.abs(dx)<tg.w/2+8&&Math.abs(dy)<tg.h/2+8){tg.hurt(1,this,h.x,false);tg.stun=Math.max(tg.stun||0,1);tg.hurtT=.12;this.impactFx(h.x,h.y,'#ffffff');this.hearts.splice(i,1);}}}
 impactFx(x,y,col){const pa=this.particles;this.camera.shake(10,.4);pa.shards(x,y,26,col);pa.shards(x,y,14,col==='#ffffff'?'#e6ecff':'#08080c');pa.sparks(x,y,30,col==='#ffffff'?'#ffffff':'#ffe9a8');pa.smoke(x,y,8,'#2a2a30');pa.dust(x,y,14,col);pa.impact(x,y,20);}   // destructive debris + screen shake
 nearestFoe(x,y,r){let best=null,bd=r;for(const m of this.world.monsters){if(!m.alive||(m.type==='ghost'&&m.alpha<.25))continue;const d=Math.hypot(m.cx-x,m.y+m.h/2-y);if(d<bd){bd=d;best=m;}}return best;}
 autoZoom(){   // stable camera: 1.0x for every normal move; Lerp to 1.45x ONLY for isClimbing / isHanging / isPushing
  const P=this.player,cam=this.camera;if(this.cine.zt||this.cine.frozen)return;
  cam.targetZoom=(P.isClimbing||P.isHanging||P.isPushing)?1.45:1;cam.zoomSpeed=2.5;}
 unlockGate(){for(const m of this.world.monsters)if(m.wave&&m.alive){m.alive=false;this.particles.smoke(m.cx,m.y+m.h/2,6,'#1a1a1e');}
  this.world.gateOpen=true;saveProgressOnStageClear();this.ui.toast('All foes eliminated — the gate is open',3);this.emit('gateOpen');}
 showStageClear(){saveProgressOnStageClear();this.gameState='STAGE_CLEAR';this.poemT=0;
  this.primary=()=>{if(this.poemT>=6.5){this.primary=null;CG.midgame(this,()=>{this.gameState='IN_GAME';this.stages.complete(true);});}};}   // natural break: poem done -> (platform ad) -> next stage
 updatePuzzle(dt){   // ONE trigger latches the gate open for good (isPermanentlyUnlocked); the 192px gate then SINKS into the earth (targetY = groundY) by Lerp
  const w=this.world;if(!w.puzzles)return;
  for(const pz of w.puzzles){const sw=pz.sw,gt=pz.gate;
   if(!gt.isPermanentlyUnlocked&&(hit(this.player,sw)||w.blocks.some(b=>hit(b,sw)))){gt.isPermanentlyUnlocked=true;sw.on=true;this.audio.sfx('thud');this.ui.toast('Gate unlocked',1.6);}
   const tgt=gt.isPermanentlyUnlocked?1:0;sw.k=damp(sw.k,tgt,10,dt);gt.lift=damp(gt.lift,tgt,3.2,dt);if(Math.abs(gt.lift-tgt)<.002)gt.lift=tgt;
   gt.s.y=lerp(gt.closedY,gt.groundY,gt.lift);
   const Ml=this.mealin;if(Ml.state==='CLIMB'&&Ml.cl&&gt.lift>.02&&gt.lift<.98&&Math.abs(Ml.cx-(gt.s.x+gt.s.w/2))<40){Ml.cl=null;Ml.noGrav=false;Ml.state='FALL';}}}
 resetRun(){this.rage.on=false;this.rage.running=false;this.rage.k=this.rage.kt=0;this.dayMode=true;this.isPaused=false;this.respawn=null;this.tileCracks=[];this.arrows=[];this.wave.active=false;this.cap=null;this.slashFx.length=0;this.modal=null;this.cine.freeze(false);this.cine.stop();
  this.stages.phase=null;this.stages.fade=0;this.stages.pend=0;this.stages.finale=false;this.gameOverT=0;this.reviveUsed={};}
 beginPlay(n){this.resetRun();this.stages.load(n);this.gameState='IN_GAME';this.audio.menuOn=false;this.audio.setMode('day');$('pauseBtn').style.display='flex';if(this.input.touch)$('touch').style.display='block';this.ui.toast('STAGE '+n,2);}
 toMenu(){this.gameState='MAIN_MENU';this.isPaused=false;$('touch').style.display='none';$('pauseBtn').style.display='none';this.menu.enter();}
 get isManDead(){return this.player.armor<=0;}
 get manArmor(){return this.player.armor;}
 set manArmor(v){this.player.armor=v;}
 doRespawn(){   // full reset at the last checkpoint (human Langno 3/3 armor, full ammo, Mealin alive)
  const P=this.player,M=this.mealin,s=this.checkpoint||this.world.spawn;
  if(this.rage.on||this.rage.running){this.cine.freeze(false);this.cine.stop();this.restoreHuman();}
  P.armor=P.maxArmor;P.x=s.x;P.y=s.y;P.vx=P.vy=0;P.invul=2.5;P.state='idle';P.noGrav=false;P.release();P.atk=null;P.ammo=P.maxAmmo;P.reloadT=0;
  if(M.state==='DEAD'){M.hp=M.maxHp;M.fade=1;M.angle=0;M.fallT=0;M.rise=1;M.setState('FOLLOW');}
  M.hp=M.maxHp;M.x=s.x-60;M.y=s.y;M.vx=M.vy=0;M.invul=1.5;this.bullets.length=0;this.hearts.length=0;this.arrows.length=0;this.camera.snap(P);this.emit('respawn');}
 addCrack(x,fy){const x0=Math.floor(x/32)*32;if(!this.world.solidAt(x0+16,fy+5))return;const r=Math.random,pts=[{x:x0+6+r()*20,y:fy}];let px=pts[0].x,py=fy;
  for(let i=0;i<5;i++){px=clamp(px+(r()-.5)*14,x0+2,x0+30);py+=4+r()*5;pts.push({x:px,y:py});}
  const br=[];for(let b=0;b<2;b++){const s0=pts[1+((r()*3)|0)],dir=r()<.5?-1:1,B=[{x:s0.x,y:s0.y}];let bx=s0.x,by=s0.y;for(let i=0;i<3;i++){bx=clamp(bx+dir*(3+r()*5),x0+1,x0+31);by+=2+r()*4;B.push({x:bx,y:by});}br.push(B);}
  this.tileCracks.push({pts,br,t:0,life:9});if(this.tileCracks.length>60)this.tileCracks.shift();}
 grantRevive(){   // reward: 1 armor bar, back at the last checkpoint X
  const P=this.player,s=this.checkpoint||this.world.spawn;this.manArmor=1;P.x=s.x;P.y=s.y;P.vx=P.vy=0;P.invul=2.5;P.state='idle';P.noGrav=false;P.release();P.atk=null;
  this.gameOverT=0;this.modal=null;this.reviveUsed[this.stages.id]=(this.reviveUsed[this.stages.id]||0)+1;this.camera.snap(P);
  if(this.mealin.state!=='DEAD')this.mealin.blink(this);this.ui.toast('Armor restored — the journey continues',2.8);this.emit('revive');}
 restoreHuman(){   // absolute: rage off, human Langno (Shelby cap + coat, normal speed), Mealin upright with 3 HP, colour world, bright day
  const P=this.player,M=this.mealin;
  this.rage.on=false;this.rage.running=false;this.rage.kt=0;this.rage.k=0;
  P.setRage(false);P.vkd=1;P.dashing=false;P.dashTrail.length=0;P.atk=null;P.combo=0;P.vx=0;P.invul=1;
  this.cap=null;this.slashFx.length=0;this.wave.active=false;
  M.hp=M.maxHp;M.fade=1;M.angle=0;M.fallT=0;M.rise=M.state==='DEAD'?1:0;M.vx=0;M.invul=1;M.setState('FOLLOW');P.ammo=P.maxAmmo;P.reloadT=0;
  for(const m of this.world.monsters){m.rage=false;m.hp=3;}
  this.dayMode=true;this.world.theme=DAY_THEME;this.audio.setMode('day');this.cine.flash(.9);
  this.ui.toast('Mealin rises — dawn breaks',3);this.emit('restore');}
 spawnWave(){   // the stage's 4 stalkers become the rage targets
  currentStageEnemiesKilled=0;let st=this.world.monsters.filter(m=>m.wave&&m.alive);while(st.length<currentStageTargetKills){this.respawnFoe();st=this.world.monsters.filter(m=>m.wave&&m.alive);}this.wave={active:true,total:currentStageTargetKills,killed:0};
  if(!st.length){completeStageRecovery();return;}this.ui.toast('ELIMINATE '+st.length+' SILHOUETTE FOES (0/'+st.length+')',3.5);this.emit('waveStart');}
 onWaveKill(m,fell){   // an enemy was destroyed (by the player, or lost off the map)
  if(!m.wave)return;if(!fell)currentStageEnemiesKilled++;
  this.wave.killed=currentStageEnemiesKilled;this.emit('waveKill',currentStageEnemiesKilled);
  if(currentStageEnemiesKilled>=currentStageTargetKills){if(this.rage.on)completeStageRecovery();else this.unlockGate();return;}
  this.respawnFoe();if(!fell)this.ui.toast('Foe down '+currentStageEnemiesKilled+'/'+currentStageTargetKills,1.6);}
 respawnFoe(){   // immediate respawn just outside the visible screen, on solid ground (keeps the kill target reachable)
  const w=this.world,cam=this.camera,P=this.player,mk=(x,y)=>{const m=new Stalker(x-15,y-56);if(this.rage.on){m.rage=true;m.hp=2;}w.monsters.push(m);};
  for(const side of (Math.random()<.5?[-1,1]:[1,-1])){const x=clamp(side<0?cam.x-90:cam.x+cam.vw+60,40,w.w-80);
   for(let y=0;y<H+200;y+=8){if(w.solidAt(x,y)&&!w.solidAt(x,y-1)&&Math.abs(y-(P.y+P.h))<260&&!w.hazards.some(h=>x>=h.x&&x<=h.x+h.w)){mk(x,y);return;}}}
  mk(clamp(P.cx+(Math.random()<.5?-1:1)*700,40,w.w-80),19*T);}
 resurrect(){completeStageRecovery();}
 completeStage(){this.restoreHuman();this.stages.pend=2.2;}   // restoration is shown, then the next stage loads
 setupAudio(){const a=this.audio;
  this.on('stageLoad',id=>a.setStage(id,this.world.theme));this.on('rageStrike',n=>a.sfx(n===3?'impact':'slash'));this.on('armorHit',()=>a.sfx('clank'));this.on('monsterDie',()=>a.sfx('thud'));this.on('mealinHit',()=>a.sfx('chime'));
  this.on('mealinDeath',()=>a.setMode('hush'));this.on('boxShatter',()=>{a.sfx('shatter');a.sfx('impact');});this.on('rageStart',()=>{a.sfx('roar');a.sfx('thud');a.setMode('rage');});this.on('stageComplete',()=>a.sfx('win'));}
 toggleMute(){const a=this.audio;a.unlock();a.setMuted(!a.muted);$('mute').textContent=a.muted?'🔇':'🔊';}
 updateCap(dt){const k=this.cap,w=this.world;if(!k||k.rest)return;
  k.vy+=1600*dt;k.x+=k.vx*dt;k.y+=k.vy*dt;k.rot+=k.vr*dt;
  if(w.solidAt(k.x+Math.sign(k.vx)*9,k.y))k.vx*=-.4;
  if(k.vy>0&&w.solidAt(k.x,k.y+5)){let n=0;while(w.solidAt(k.x,k.y+5)&&n++<60)k.y-=1;k.vy*=-.32;k.vx*=.6;k.vr*=.5;if(Math.abs(k.vy)<90){k.vy=0;k.vx=0;k.vr=0;k.rest=true;k.rot=.25*Math.sign(k.rot||1);}}}
 on(ev,fn){(this.hooks[ev]=this.hooks[ev]||[]).push(fn);}
 emit(ev,...a){(this.hooks[ev]||[]).forEach(f=>f(...a));}
 onMealinHit(m){this.camera.shake(5,.25);this.particles.burst(m.cx,m.y+20,10,{color:'#ff6fae',glow:true,spread:90,up:90,g:200});this.emit('mealinHit',m);}   // Day 3 hook
 onMealinDeath(m){this.emit('mealinDeath',m);if(!this.rage.on&&!this.rage.running)this.rage.begin(m);}
 onArmorHit(p){this.emit('armorHit',p);}
 onGameOver(){this.emit('gameOver');if(!this.respawn)this.respawn={t:0,done:false};}   // no ad, no game-over screen: 0.25 s fade out -> respawn -> 0.25 s fade in
 interact(){const p=this.player,b=this.box;if(p.grab||p.findBlock(this))return;
  if(p.carrying){b.carried=false;p.carrying=null;b.vx=p.facing*160;b.vy=-180;this.ui.toast('Kotak musik diletakkan',1.2);return;}
  if(!b.broken&&!this.rage.on&&Math.hypot(b.x+b.w/2-p.cx,b.y-p.y-p.h/2)<70){b.carried=true;p.carrying=b;this.ui.toast('Kotak musik diangkat',1.2);return;}
  for(const it of this.world.interactables)if(hit(p,it)){this.ui.toast(it.text,2.5);return;}}
 debugDraw(c){const cam=this.camera;c.lineWidth=1;c.strokeStyle='rgba(120,200,255,.15)';c.beginPath();
  for(let x=Math.floor(cam.x/T)*T;x<cam.x+cam.vw;x+=T){c.moveTo(x,cam.y);c.lineTo(x,cam.y+cam.vh);}
  for(let y=Math.floor(cam.y/T)*T;y<cam.y+cam.vh;y+=T){c.moveTo(cam.x,y);c.lineTo(cam.x+cam.vw,y);}c.stroke();
  c.strokeStyle='#f55';for(const s of this.world.solids)c.strokeRect(s.x,s.y,s.w,s.h);
  c.strokeStyle='#5f5';for(const e of [this.player,this.mealin,this.box,...this.world.blocks,...this.world.monsters,...this.world.hazards])c.strokeRect(e.x,e.y,e.w,e.h);
  c.strokeStyle='#ff0';c.strokeRect(cam.x+cam.vw/2-cam.dead.w/2,cam.y+cam.vh/2-cam.dead.h/2,cam.dead.w,cam.dead.h);}
}
window.game=new Game();CG.boot(window.game);
